name: Public API tests
on:
  push:
    paths: ['src/deciform/core/**', 'tests/public/**', 'configs/public/**', 'pyproject.toml', '.github/workflows/public-tests.yml']
  pull_request:
    paths: ['src/deciform/core/**', 'tests/public/**', 'configs/public/**', 'pyproject.toml', '.github/workflows/public-tests.yml']
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.11.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]' 'transformers==5.20.2'
      - run: python -m pytest -q tests/public
