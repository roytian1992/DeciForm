[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deciform"
version = "0.2.0"
description = "Open-weight models for structured decision making"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["numpy>=1.26,<3", "torch>=2.10", "transformers>=5.3,<6", "peft>=0.18,<1", "safetensors>=0.5", "accelerate>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
data = ["datasets>=3,<6", "pyarrow>=15"]

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests/public"]
pythonpath = ["src"]

[project.scripts]
deciform = "deciform.core.cli:main"

[tool.setuptools.package-data]
"deciform.core.integrations" = ["LICENSE.kev"]
